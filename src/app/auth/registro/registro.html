<section class="registro-container">
  <header>
    <h1>Únete a HealthTrack</h1>
    <p>Crea tu cuenta y comienza tu viaje de salud</p>
  </header>

  <main>
    <h2>Crear Cuenta</h2>

    <form>
      <div>
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" />
      </div>

      <div>
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="tu@email.com" />
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="********" />
      </div>

      <div>
        <label for="confirmarPassword">Confirmar Contraseña</label>
        <input
          type="password"
          id="confirmarPassword"
          placeholder="********"
        />
      </div>

      <hr />

      <h3>Datos de Salud</h3>

      <div class="salud-grid">
        <div>
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" formControlName="peso" />
        </div>

        <div>
          <label for="altura">Altura (cm)</label>
          <input type="number" id="altura" formControlName="altura" />
        </div>

        <div>
          <label for="edad">Edad (años)</label>
          <input type="number" id="edad" formControlName="edad" />
        </div>
      </div>

      <button type="submit">Crear Cuenta</button>
    </form>

    <p>
      ¿Ya tienes una cuenta?
      <a routerLink="./login">Inicia sesión</a>
    </p>
  </main>
</section>
