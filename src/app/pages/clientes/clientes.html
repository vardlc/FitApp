<div class="panel">


  <header class="header">
    <h2>💪 Mi Panel</h2>
    <button class="logout">⎋ Cerrar Sesión</button>
  </header>

  <section class="cards">
    <div class="card">
      <div class="icon fire">🔥</div>
      <div>
        <p>Racha Actual</p>
        <h3>0</h3>
      </div>
    </div>

    <div class="card">
      <div class="icon check">✔</div>
      <div>
        <p>Días Completados</p>
        <h3>0</h3>
      </div>
    </div>

    <div class="card">
      <div class="icon dumbbell">🏋️</div>
      <div>
        <p>Rutinas Activas</p>
        <h3>0</h3>
      </div>
    </div>
  </section>

  <section class="rutinas">
    <h3>Mis Rutinas</h3>

    <div class="rutina-box">
      <div class="empty">
        <span class="big-icon">🏋️</span>
        <p>No tienes <span>rutinas</span> asignadas aún.</p>
      </div>
    </div>
  </section>

  <section class="seguimiento">
    <h3>📅 Seguimiento</h3>

    <div class="calendar">
      <div class="calendar-header">
        <button>‹</button>
        <span>Abril 2026</span>
        <button>›</button>
      </div>

      <div class="days">
        <span>Dom</span>
        <span>Lun</span>
        <span>Mar</span>
        <span>Mié</span>
        <span>Jue</span>
        <span>Vie</span>
        <span>Sáb</span>
      </div>

      <div class="grid">
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
        <div class="day"></div>
      </div>
    </div>
  </section>

</div>
