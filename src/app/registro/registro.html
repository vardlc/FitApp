<section class="registro-container">

  <div class="registro-card">

    <!-- PANEL CUENTA -->
    <div class="panel panel-cuenta">

      <div class="panel-header">
        <h1>HealthTrack</h1>
        <p>Crear cuenta</p>
      </div>

      <form class="form-cuenta">

        <div class="input-group">
          <label>Nombre completo</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Juan Pérez">
        </div>

        <div class="input-group">
          <label>Correo electrónico</label>
          <input type="email" [(ngModel)]="correo" name="correo" placeholder="correo@email.com">
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••">
        </div>

        <div class="input-group">
          <label>Confirmar contraseña</label>
          <input type="password" [(ngModel)]="confirmarPassword" name="confirmarPassword">
        </div>

      </form>

    </div>


    <!-- PANEL SALUD -->
    <div class="panel panel-salud" *ngIf="formCompleto()">

      <h2>Datos de Salud</h2>

      <div class="salud-grid">

        <div class="input-group">
          <label>Peso (kg)</label>
          <input type="number">
        </div>

        <div class="input-group">
          <label>Altura (cm)</label>
          <input type="number">
        </div>

        <div class="input-group">
          <label>Edad</label>
          <input type="number">
        </div>

      </div>

      <button>Crear Cuenta</button>

    </div>

  </div>

  <p class="login-link">
    ¿Ya tienes cuenta?
    <a routerLink="./login">Inicia sesión</a>
  </p>

</section>
